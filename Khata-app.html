<!DOCTYPE html>
<html lang="ur">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chishti Khata</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f6f9;
    margin: 0;
    padding: 15px;
    direction: rtl;
    color: #222;
}

.header {
    background: #1677ff;
    color: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 15px;
}

.header h1 {
    margin: 0;
    color: white;
}

.box {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 14px;
    box-shadow: 0 2px 8px #ddd;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: none;
    border-radius: 9px;
    font-size: 16px;
    color: white;
    cursor: pointer;
}

.add {
    background: #1677ff;
}

.give {
    background: #e67e22;
}

.receive {
    background: #16a085;
}

.edit {
    background: #8e44ad;
}

.delete {
    background: #e53935;
}

.back {
    background: #555;
}

.whatsapp {
    background: #25d366;
}

.backup {
    background: #34495e;
}

.restore {
    background: #7f8c8d;
}

.customer {
    background: white;
    padding: 15px;
    margin-top: 12px;
    border-radius: 13px;
    box-shadow: 0 2px 7px #ddd;
}

.customer-name {
    color: #1677ff;
    cursor: pointer;
}

.balance {
    font-size: 19px;
    font-weight: bold;
    margin: 8px 0;
}

.summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.summary-card {
    padding: 14px;
    border-radius: 12px;
    text-align: center;
    color: white;
}

.summary-card small {
    display: block;
    margin-bottom: 5px;
}

.summary-card strong {
    font-size: 18px;
}

.given {
    background: #e67e22;
}

.received {
    background: #16a085;
}

.current {
    background: #1677ff;
    grid-column: 1 / 3;
}

.transaction {
    background: #f7f7f7;
    padding: 13px;
    margin-top: 10px;
    border-radius: 9px;
    border-right: 5px solid #777;
}

.transaction-give {
    border-right-color: #e67e22;
}

.transaction-receive {
    border-right-color: #16a085;
}

.transaction small {
    color: #666;
}

.empty {
    text-align: center;
    color: #777;
    padding: 15px;
}

.detail {
    display: none;
}

.file-input {
    display: none;
}

</style>

</head>

<body>


<!-- ================= MAIN PAGE ================= -->

<div id="mainPage">

<div class="header">

<h1>📒 Chishti Khata</h1>

<p>
آپ کا ڈیجیٹل حساب
</p>

</div>


<div class="box">

<h2>➕ نیا گاہک</h2>

<input
id="name"
type="text"
placeholder="گاہک کا نام"
>

<button
class="add"
onclick="addCustomer()">

➕ گاہک شامل کریں

</button>

</div>


<div class="box">

<h2>👥 گاہکوں کا حساب</h2>

<input
id="search"
type="text"
placeholder="🔍 گاہک تلاش کریں"
oninput="showCustomers()"
>

<div id="customers"></div>

</div>


<div class="box">

<h2>💾 Data</h2>

<button
class="backup"
onclick="backupData()">

📤 Backup بنائیں

</button>

<button
class="restore"
onclick="document.getElementById('restoreFile').click()">

📥 Backup Restore کریں

</button>

<input
id="restoreFile"
class="file-input"
type="file"
accept=".json"
onchange="restoreData(event)"
>

</div>

</div>



<!-- ================= DETAIL PAGE ================= -->

<div
id="detailPage"
class="detail"
>

<button
class="back"
onclick="goBack()">

⬅️ واپس

</button>


<div class="box">

<h1
id="detailName"
style="text-align:center;">
</h1>


<div class="summary">


<div class="summary-card given">

<small>
کل ادھار دیا
</small>

<strong>
Rs.
<span id="totalGiven">
0
</span>
</strong>

</div>


<div class="summary-card received">

<small>
کل وصول ہوا
</small>

<strong>
Rs.
<span id="totalReceived">
0
</span>
</strong>

</div>


<div class="summary-card current">

<small>
موجودہ بقایا
</small>

<strong>
Rs.
<span id="detailBalance">
0
</span>
</strong>

</div>


</div>


<button
class="give"
onclick="giveMoneyFromDetail()">

💰 ادھار دیں

</button>


<button
class="receive"
onclick="receiveMoneyFromDetail()">

💵 رقم وصول کریں

</button>


<button
class="edit"
onclick="editCustomer()">

✏️ گاہک کا نام تبدیل کریں

</button>


<button
class="whatsapp"
onclick="shareWhatsApp()">

📱 WhatsApp پر حساب بھیجیں

</button>

</div>



<div class="box">

<h2>
📜 Transaction History
</h2>

<div id="detailHistory"></div>

</div>



<div class="box">

<button
class="delete"
onclick="deleteSelectedCustomer()">

🗑️ یہ گاہک Delete کریں

</button>

</div>

</div>



<script>


/* ================= DATA ================= */

let customers =
JSON.parse(
localStorage.getItem("customers")
) || [];

let selectedCustomer = null;



/* ================= SAVE ================= */

function saveData() {

localStorage.setItem(
"customers",
JSON.stringify(customers)
);

}



/* ================= ADD CUSTOMER ================= */

function addCustomer() {

let name =
document
.getElementById("name")
.value
.trim();


if (name === "") {

alert("گاہک کا نام لکھیں");

return;

}


let exists =
customers.some(function(customer) {

return customer.name.toLowerCase()
=== name.toLowerCase();

});


if (exists) {

alert("یہ گاہک پہلے سے موجود ہے");

return;

}


customers.push({

name: name,

balance: 0,

history: []

});


saveData();


document
.getElementById("name")
.value = "";


showCustomers();

}



/* ================= GIVE ================= */

function giveMoney(index) {

let amount =
Number(
prompt("کتنی رقم ادھار دی؟")
);


if (
isNaN(amount) ||
amount <= 0
) {

return;

}


customers[index].balance += amount;


customers[index].history.push({

type: "ادھار دیا",

amount: amount,

date:
new Date().toLocaleString()

});


saveData();


showCustomers();

}



/* ================= RECEIVE ================= */

function receiveMoney(index) {

let amount =
Number(
prompt("کتنی رقم وصول ہوئی؟")
);


if (
isNaN(amount) ||
amount <= 0
) {

return;

}


customers[index].balance -= amount;


if (
customers[index].balance < 0
) {

customers[index].balance = 0;

}


customers[index].history.push({

type: "رقم وصول ہوئی",

amount: amount,

date:
new Date().toLocaleString()

});


saveData();


showCustomers();

}



/* ================= SHOW CUSTOMERS ================= */

function showCustomers() {

let container =
document.getElementById("customers");


let search =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


container.innerHTML = "";


let filtered =
customers.filter(function(customer) {

return customer.name
.toLowerCase()
.includes(search);

});


if (
filtered.length === 0
) {

container.innerHTML =
'<div class="empty">کوئی گاہک نہیں ملا۔</div>';

return;

}


filtered.forEach(function(customer) {


let index =
customers.indexOf(customer);


container.innerHTML += `

<div class="customer">

<h3
class="customer-name"
onclick="openCustomer(${index})">

👤 ${customer.name}

</h3>


<div class="balance">

بقایا:
Rs. ${customer.balance}

</div>


<button
class="give"
onclick="giveMoney(${index})">

💰 ادھار دیں

</button>


<button
class="receive"
onclick="receiveMoney(${index})">

💵 رقم وصول کریں

</button>


<button
class="delete"
onclick="deleteCustomer(${index})">

🗑️ Delete

</button>

</div>

`;

});

}



/* ================= OPEN CUSTOMER ================= */

function openCustomer(index) {

selectedCustomer = index;


document
.getElementById("mainPage")
.style.display = "none";


document
.getElementById("detailPage")
.style.display = "block";


showCustomerDetail();

}



/* ================= DETAIL ================= */

function showCustomerDetail() {

if (
selectedCustomer === null
) {

return;

}


let customer =
customers[selectedCustomer];


document
.getElementById("detailName")
.innerText =
"👤 " + customer.name;


document
.getElementById("detailBalance")
.innerText =
customer.balance;


let totalGiven = 0;

let totalReceived = 0;


if (customer.history) {

customer.history.forEach(
function(item) {

/* FIX: پرانے emoji والے records بھی count ہوں گے */

if (
String(item.type || "").includes("ادھار")
) {

totalGiven +=
Number(item.amount);

}


if (
String(item.type || "").includes("وصول")
) {

totalReceived +=
Number(item.amount);

}

});

}


document
.getElementById("totalGiven")
.innerText =
totalGiven;


document
.getElementById("totalReceived")
.innerText =
totalReceived;



/* HISTORY */

let history =
document
.getElementById("detailHistory");


history.innerHTML = "";


if (
!customer.history ||
customer.history.length === 0
) {

history.innerHTML =
'<div class="empty">ابھی کوئی transaction نہیں ہے۔</div>';

return;

}


customer.history
.slice()
.reverse()
.forEach(function(item, index) {


let transactionClass =
"transaction";


/* FIX: پرانے records بھی صحیح رنگ میں آئیں گے */

if (
String(item.type || "").includes("ادھار")
) {

transactionClass +=
" transaction-give";

}


if (
String(item.type || "").includes("وصول")
) {

transactionClass +=
" transaction-receive";

}


history.innerHTML += `

<div class="${transactionClass}">

<strong>
${item.type}
</strong>

<br>

💰 رقم:
<strong>
Rs. ${item.amount}
</strong>

<br>

<small>
📅 ${item.date}
</small>

<button
class="delete"
onclick="deleteTransaction(${index})">

🗑️ Transaction Delete

</button>

</div>

`;

});

}



/* ================= GIVE DETAIL ================= */

function giveMoneyFromDetail() {

if (
selectedCustomer === null
) {

return;

}


let amount =
Number(
prompt("کتنی رقم ادھار دی؟")
);


if (
isNaN(amount) ||
amount <= 0
) {

return;

}


customers[selectedCustomer]
.balance += amount;


customers[selectedCustomer]
.history.push({

type: "ادھار دیا",

amount: amount,

date:
new Date().toLocaleString()

});


saveData();


showCustomerDetail();

}



/* ================= RECEIVE DETAIL ================= */

function receiveMoneyFromDetail() {

if (
selectedCustomer === null
) {

return;

}


let amount =
Number(
prompt("کتنی رقم وصول ہوئی؟")
);


if (
isNaN(amount) ||
amount <= 0
) {

return;

}


customers[selectedCustomer]
.balance -= amount;


if (
customers[selectedCustomer]
.balance < 0
) {

customers[selectedCustomer]
.balance = 0;

}


customers[selectedCustomer]
.history.push({

type: "رقم وصول ہوئی",

amount: amount,

date:
new Date().toLocaleString()

});


saveData();


showCustomerDetail();

}



/* ================= EDIT CUSTOMER ================= */

function editCustomer() {

if (
selectedCustomer === null
) {

return;

}


let oldName =
customers[selectedCustomer]
.name;


let newName =
prompt(
"نیا نام لکھیں:",
oldName
);


if (
newName === null ||
newName.trim() === ""
) {

return;

}


customers[selectedCustomer]
.name =
newName.trim();


saveData();


showCustomerDetail();

}



/* ================= DELETE TRANSACTION ================= */

function deleteTransaction(reverseIndex) {

if (
selectedCustomer === null
) {

return;

}


let customer =
customers[selectedCustomer];


let realIndex =
customer.history.length -
1 -
reverseIndex;


if (
confirm(
"کیا یہ transaction delete کرنا ہے؟"
)
) {


let item =
customer.history[realIndex];


/* FIX: پرانا emoji والا ادھار بھی پہچانے گا */

if (
String(item.type || "").includes("ادھار")
) {

customer.balance -=
Number(item.amount);

}


/* FIX: پرانی وصولی بھی پہچانے گا */

if (
String(item.type || "").includes("وصول")
) {

customer.balance +=
Number(item.amount);

}


if (
customer.balance < 0
) {

customer.balance = 0;

}


customer.history.splice(
realIndex,
1
);


saveData();


showCustomerDetail();

}

}



/* ================= DELETE CUSTOMER ================= */

function deleteCustomer(index) {

if (
confirm(
"کیا یہ گاہک delete کرنا ہے؟"
)
) {

customers.splice(
index,
1
);


saveData();


showCustomers();

}

}



/* ================= DELETE SELECTED ================= */

function deleteSelectedCustomer() {

if (
selectedCustomer === null
) {

return;

}


let name =
customers[selectedCustomer]
.name;


if (
confirm(
"کیا " +
name +
" کا مکمل حساب delete کرنا ہے؟"
)
) {

customers.splice(
selectedCustomer,
1
);


saveData();


selectedCustomer = null;


goBack();

}

}



/* ================= WHATSAPP ================= */

function shareWhatsApp() {

if (
selectedCustomer === null
) {

return;

}


let customer =
customers[selectedCustomer];


let totalGiven = 0;

let totalReceived = 0;


customer.history.forEach(
function(item) {

/* FIX: پرانے اور نئے دونوں records */

if (
String(item.type || "").includes("ادھار")
) {

totalGiven +=
Number(item.amount);

}


if (
String(item.type || "").includes("وصول")
) {

totalReceived +=
Number(item.amount);

}

});


let message =

"📒 Chishti Khata%0A%0A" +

"👤 گاہک: " +
customer.name +
"%0A%0A" +

"💰 کل ادھار: Rs. " +
totalGiven +
"%0A" +

"💵 کل وصول: Rs. " +
totalReceived +
"%0A" +

"💳 موجودہ بقایا: Rs. " +
customer.balance +
"%0A%0A" +

"شکریہ — Chishti Traders";


window.open(
"https://wa.me/?text=" +
message,
"_blank"
);

}



/* ================= BACKUP ================= */

function backupData() {

let data =
JSON.stringify(
customers,
null,
2
);


let blob =
new Blob(
[data],
{
type: "application/json"
}
);


let url =
URL.createObjectURL(blob);


let a =
document.createElement("a");


a.href = url;

a.download =
"Chishti-Khata-Backup.json";


a.click();


URL.revokeObjectURL(url);

}



/* ================= RESTORE ================= */

function restoreData(event) {

let file =
event.target.files[0];


if (!file) {

return;

}


let reader =
new FileReader();


reader.onload =
function(e) {

try {


let data =
JSON.parse(
e.target.result
);


if (
!Array.isArray(data)
) {

throw new Error();

}


customers = data;


saveData();


showCustomers();


alert(
"Backup کامیابی سے Restore ہوگیا۔"
);


}
catch {

alert(
"Backup file درست نہیں ہے۔"
);

}

};


reader.readAsText(file);

}



/* ================= BACK ================= */

function goBack() {

document
.getElementById("detailPage")
.style.display = "none";


document
.getElementById("mainPage")
.style.display = "block";


showCustomers();

}



/* ================= START ================= */

showCustomers();

</script>

</body>
</html>
